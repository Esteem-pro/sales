<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Прайс-лист | Единый портал продавца</title>
    
    <!-- Шрифты и библиотеки -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>

    <!-- ПРОВЕРКА АВТОРИЗАЦИИ -->
    <script>
        if (!localStorage.getItem('sales_dash_user') || !localStorage.getItem('sales_dash_pass')) {
            window.location.replace('index.html');
        }
    </script>

    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f1f5f9; 
            color: #0f172a; 
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            touch-action: manipulation;
            -webkit-font-smoothing: antialiased;
        }
        button, input, select, textarea { touch-action: manipulation; }

        .scroll-area { flex: 1; overflow-y: auto; padding-bottom: calc(env(safe-area-inset-bottom) + 120px); }
        .scroll-area::-webkit-scrollbar { width: 6px; }
        .scroll-area::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        body.modal-open { overflow: hidden; touch-action: none; }

        /* Динамическое позиционирование липких элементов (Поиск и Корзина) */
        #search-container {
            top: calc(var(--nav-h, 60px) + 16px);
            transition: top 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        body.nav-hidden #search-container {
            top: 16px;
        }

        @media (min-width: 768px) {
            #esCartWidget {
                top: calc(var(--nav-h, 60px) + 90px);
                transition: top 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            }
            body.nav-hidden #esCartWidget {
                top: 90px;
            }
        }

        @media (max-width: 768px) {
            .mobile-cart-sheet { max-height: 62px; transition: max-height 0.4s cubic-bezier(0.2, 1, 0.3, 1); }
            .mobile-cart-sheet.is-open { max-height: 75dvh; }
            .mobile-cart-content { opacity: 0; pointer-events: none; transition: opacity 0.2s ease; }
            .mobile-cart-sheet.is-open .mobile-cart-content { opacity: 1; pointer-events: auto; transition: opacity 0.3s ease 0.15s; }
            .mobile-cart-sheet:not(.is-open) .cart-header-border { border-color: transparent; }
        }
    </style>
</head>
<body>

    <!-- ОБЩЕПОРТАЛЬНАЯ НАВИГАЦИЯ -->
    <nav id="portal-nav" class="fixed top-0 left-0 w-full bg-slate-900 text-white px-3 sm:px-4 pb-3 pt-[calc(env(safe-area-inset-top,0px)+12px)] flex justify-between items-center gap-2 z-[60] transition-transform duration-300">
        <div class="flex gap-1 sm:gap-2 font-semibold text-[13px] sm:text-sm">
            <a href="index.html" class="px-3 py-2 rounded-lg transition-colors hover:bg-white/10 text-slate-300">Аналитика</a>
            <a href="catalog.html" class="px-3 py-2 rounded-lg transition-colors bg-white/20 text-white">Прайс</a>
            <a href="calculator.html" class="px-3 py-2 rounded-lg transition-colors hover:bg-white/10 text-slate-300">Доставка</a>
            <a href="materials.html" class="px-3 py-2 rounded-lg transition-colors hover:bg-white/10 text-slate-300 whitespace-nowrap">Рабочие материалы</a>
        </div>
        <button onclick="logout()" class="p-2 bg-rose-500/20 text-rose-400 hover:bg-rose-500 hover:text-white rounded-lg transition shrink-0" aria-label="Выйти">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
        </button>
    </nav>

    <!-- ОБЛАСТЬ ПРОКРУТКИ -->
    <div class="scroll-area flex flex-col w-full relative">
        
        <!-- ЛИПКИЙ ПОИСК -->
        <div id="search-container" class="sticky z-40 w-full pointer-events-none mb-6 sm:mb-8 mt-4 sm:mt-6">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 pointer-events-auto w-full">
                <div class="relative shadow-[0_8px_30px_rgb(0,0,0,0.06)] rounded-[1.2rem]">
                    <input type="text" id="esSearch" 
                        class="w-full bg-white/80 backdrop-blur-xl border border-white/60 focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 rounded-[1.2rem] px-5 py-3.5 pl-12 outline-none transition-all text-slate-800 placeholder-slate-400 font-medium text-base" 
                        placeholder="Поиск товаров">
                    <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>
            </div>
        </div>

        <div class="max-w-7xl mx-auto px-4 sm:px-6 flex flex-col md:flex-row gap-6 items-start w-full">
            
            <div class="flex-1 w-full">
                <div id="esGrid" class="grid grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3 sm:gap-5">
                </div>
            </div>

            <!-- КОРЗИНА -->
            <div id="esCartWidget" class="mobile-cart-sheet md:transform-none fixed md:sticky bottom-4 inset-x-0 md:bottom-auto z-50 md:z-10 w-full md:w-80 lg:w-96 bg-transparent flex flex-col mx-auto px-4 sm:px-6 md:px-0 md:max-h-[calc(100vh-130px)] md:mt-0">
                <div class="bg-white rounded-[1.2rem] md:rounded-[1.5rem] border border-slate-200/80 shadow-[0_12px_40px_-10px_rgba(0,0,0,0.15)] md:shadow-[0_4px_20px_-2px_rgba(0,0,0,0.03)] flex flex-col flex-1 min-h-0 overflow-hidden">
                    
                    <div class="cart-header-border p-4 sm:p-5 border-b border-slate-100 flex justify-between items-center bg-slate-900 md:bg-white text-white md:text-slate-900 cursor-pointer md:cursor-default transition-colors shrink-0 touch-none md:touch-auto" onclick="toggleMobileCart()">
                        <div class="flex items-center gap-2">
                            <h2 class="font-extrabold text-lg">Корзина</h2>
                            <span id="cart-count-badge" class="bg-blue-500 md:bg-slate-100 md:text-slate-600 text-white text-xs font-bold px-2 py-0.5 rounded-full hidden">0</span>
                        </div>
                        <svg id="mobile-cart-arrow" class="w-6 h-6 md:hidden transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path></svg>
                    </div>

                    <div class="mobile-cart-content flex flex-col flex-1 overflow-hidden min-h-0">
                        <div id="esCartItems" class="flex-1 overflow-y-auto overscroll-y-contain p-4 bg-[#f1f5f9]/50">
                            <div class="text-center py-8 text-slate-400 font-medium text-sm">Корзина пуста</div>
                        </div>
                        <div class="p-4 sm:p-5 bg-white border-t border-slate-100 shrink-0">
                            <div class="flex justify-between items-center mb-1 text-sm font-semibold">
                                <span class="text-slate-500">Доход продавца:</span>
                                <span id="esTotalIncome" class="text-emerald-500">0 ₽</span>
                            </div>
                            <div class="flex justify-between items-end mb-4">
                                <span class="text-slate-500 font-semibold mb-1">Итого:</span>
                                <span id="esTotalSum" class="text-2xl font-extrabold text-slate-900 tracking-tight">0 ₽</span>
                            </div>
                            <button class="w-full bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold p-3 rounded-[1rem] transition-colors text-sm" onclick="clearCart(event)">
                                Очистить корзину
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО -->
    <div id="esModal" class="fixed top-0 left-0 w-full h-[100dvh] bg-slate-900/40 backdrop-blur-sm z-[100] hidden items-center justify-center p-4 sm:p-6">
        <div class="bg-white rounded-[1.5rem] shadow-2xl max-w-lg w-full flex flex-col max-h-[85dvh] overflow-hidden transform transition-all relative">
            <div class="px-5 py-4 border-b border-slate-100 flex justify-between items-start bg-slate-50/50 shrink-0">
                <h3 id="esModalTitle" class="font-extrabold text-slate-900 text-lg pr-4 leading-snug">Товар</h3>
                <button onclick="closeModal()" class="w-8 h-8 flex items-center justify-center bg-slate-200 hover:bg-slate-300 text-slate-600 rounded-full transition-colors shrink-0 mt-0.5">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <div class="p-5 overflow-y-auto flex-1">
                <div class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Комплектация (База)</div>
                <div id="esBasesList" class="space-y-2"></div>
                
                <div id="esAddonsContainer" class="mt-6 hidden">
                    <div class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Дополнительные опции</div>
                    <div id="esAddonsList" class="space-y-2"></div>
                </div>
            </div>
            
            <div class="px-5 py-4 border-t border-slate-100 bg-slate-50 flex flex-col gap-4 shrink-0">
                <div class="flex justify-between items-center">
                    <span class="font-semibold text-slate-600 text-sm">Количество:</span>
                    <div class="flex items-center gap-3 bg-white border border-slate-200 p-1 rounded-full shadow-sm">
                        <button class="w-7 h-7 flex items-center justify-center bg-slate-100 hover:bg-slate-200 rounded-full text-slate-600 font-bold transition-colors" onclick="changeBaseQty(-1)">-</button>
                        <span id="esBaseQtyVal" class="w-6 text-center font-bold text-slate-900 text-sm">1</span>
                        <button class="w-7 h-7 flex items-center justify-center bg-slate-100 hover:bg-slate-200 rounded-full text-slate-600 font-bold transition-colors" onclick="changeBaseQty(1)">+</button>
                    </div>
                </div>
                
                <div class="flex justify-between items-center pt-2 border-t border-slate-200/60">
                    <div id="esModalPrice" class="text-2xl font-extrabold text-slate-900">0 ₽</div>
                    <button id="esModalBtn" class="bg-slate-900 hover:bg-slate-800 text-white px-6 py-3 rounded-xl font-bold transition-colors" onclick="confirmAddToCart()">В корзину</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function logout() {
            localStorage.removeItem('sales_dash_user');
            localStorage.removeItem('sales_dash_pass');
            localStorage.removeItem('sales_dash_data');
            window.location.href = 'index.html';
        }

        const COL_NAME = 0;   // A
        const COL_PRICE = 3;  // D
        const COL_INCOME = 7; // H
        
        const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQcZaUg1LNjHtFku3mI5B6_xYDitZkRM94rlESJLKVqpMeMHkwqRUelOGkbuZ365Znq296r3zixxONC/pub?gid=0&single=true&output=csv" + "&t=" + new Date().getTime();
        
        let database = [];
        let cart = [];
        let catalogMemory = {}; 
        let currentSelection = null;
        
        const fmt = (n) => new Intl.NumberFormat('ru-RU').format(n) + ' ₽';
        
        const esc = (str) => {
            if (!str) return '';
            return String(str).replace(/[&<>'"]/g, match => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            })[match]);
        };

        document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function (event) {
            let now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) { event.preventDefault(); }
            lastTouchEnd = now;
        }, false);

        function renderSkeleton() {
            const grid = document.getElementById('esGrid');
            grid.innerHTML = "";
            for(let i=0; i<8; i++) {
                grid.innerHTML += `
                    <div class="bg-white p-4 sm:p-5 rounded-[1.5rem] border border-slate-200 shadow-[0_4px_20px_-2px_rgba(0,0,0,0.03)] animate-pulse flex flex-col justify-between min-h-[120px]">
                        <div class="h-4 bg-slate-200 rounded w-3/4 mb-4"></div>
                        <div class="h-4 bg-slate-200 rounded w-1/2 mb-6"></div>
                        <div class="h-5 bg-slate-200 rounded w-1/3 mt-auto"></div>
                    </div>
                `;
            }
        }

        if(typeof Papa === 'undefined') { setTimeout(initApp, 1000); } else { initApp(); }

        function initApp() {
            renderSkeleton();
            Papa.parse(SHEET_URL, {
                download: true, header: false,
                complete: function(results) { processData(results.data); },
                error: function() { document.getElementById('esGrid').innerHTML = "<div class='col-span-full text-center text-rose-500 py-10 font-medium'>Ошибка загрузки данных</div>"; }
            });
        }

        function parsePrice(str) {
            if(!str) return { val:0, isPercent:false };
            let s = str.toString().trim();
            if(s.includes('%')) {
                return { val: parseFloat(s.replace(',','.').replace(/[^0-9.]/g, '')), isPercent: true };
            }
            if(s.toLowerCase().includes('запрос')) return { val:0, isPercent:false, isRequest:true };
            let clean = s.replace(/[^0-9]/g, ''); 
            return { val: parseInt(clean) || 0, isPercent: false };
        }

        function processData(rows) {
            database = [];
            let currentGroup = null;
            let isAddons = false;

            rows.forEach((row) => {
                if(!row[COL_NAME]) return; 
                let name = row[COL_NAME].trim();
                if(name === "") return;

                let priceRaw = row[COL_PRICE];
                let isHeader = (!priceRaw || priceRaw.trim() === "") 
                               && !name.toLowerCase().includes("позиция")
                               && !name.toLowerCase().includes("себестоимость");

                if(name.toLowerCase().includes("доп. элементы")) {
                    isAddons = true; return; 
                }

                if(isHeader) {
                    currentGroup = { title: name, items: [], addons: [] };
                    database.push(currentGroup);
                    isAddons = false;
                } else if(currentGroup && !name.toLowerCase().includes("позиция")) {
                    let p = parsePrice(row[COL_PRICE]);
                    let inc = parsePrice(row[COL_INCOME]);
                    let item = { name, price: p.val, isPercent: p.isPercent, isRequest: p.isRequest, income: inc.val };
                    
                    if(isAddons) currentGroup.addons.push(item);
                    else currentGroup.items.push(item);
                }
            });

            database = database.filter(g => g.items.length > 0 || g.addons.length > 0);
            renderCatalog();
        }

        function renderCatalog(filter = "") {
            const grid = document.getElementById('esGrid');
            grid.innerHTML = "";
            let lower = filter.toLowerCase();

            database.forEach((group, idx) => {
                let match = group.title.toLowerCase().includes(lower) || group.items.some(i => i.name.toLowerCase().includes(lower));
                if(!match) return;

                let prices = group.items.map(i => i.isPercent ? 0 : i.price);
                let minP = Math.min(...prices);
                let priceText = minP > 0 ? `от ${fmt(minP)}` : (group.items.some(i=>i.isPercent) ? "Расчет %" : "По запросу");

                let card = document.createElement('div');
                card.className = 'bg-white p-4 sm:p-5 rounded-[1.5rem] border border-slate-200 shadow-[0_4px_20px_-2px_rgba(0,0,0,0.03)] hover:border-blue-400 hover:shadow-[0_8px_25px_-5px_rgba(0,0,0,0.06)] hover:-translate-y-1 transition-all duration-300 cursor-pointer flex flex-col justify-between min-h-[120px] relative group';
                card.onclick = () => openModalFromCatalog(idx);
                card.innerHTML = `
                    <div class="font-bold text-slate-800 text-sm sm:text-base leading-snug mb-3 group-hover:text-blue-700 transition-colors">${esc(group.title)}</div>
                    <div class="mt-auto font-extrabold text-blue-600 text-base">${priceText}</div>
                `;
                grid.appendChild(card);
            });
            
            if(grid.innerHTML === "") {
                grid.innerHTML = "<div class='col-span-full text-center text-slate-500 py-10 font-medium'>Ничего не найдено</div>";
            }
        }

        function openModalFromCatalog(idx) {
            let saved = catalogMemory[idx];
            if (saved) {
                currentSelection = JSON.parse(JSON.stringify(saved));
                currentSelection.mode = 'new';
                currentSelection.cartIdx = -1;
            } else {
                currentSelection = { groupIdx: idx, baseIdx: 0, baseQty: 1, addons: {}, mode: 'new', cartIdx: -1 };
            }
            renderModalContent();
        }

        function openModalFromCart(cartIndex) {
            let item = cart[cartIndex];
            let groupIdx = database.findIndex(g => g.title === item.title);
            let group = database[groupIdx];
            let addonsMap = {};
            item.addons.forEach(savedAddon => {
                let foundIdx = group.addons.findIndex(a => a.name === savedAddon.name);
                if(foundIdx !== -1) addonsMap[foundIdx] = savedAddon.qty;
            });
            let baseIdx = group.items.findIndex(b => b.name === item.base.name);
            if(baseIdx === -1) baseIdx = 0;

            currentSelection = { groupIdx: groupIdx, baseIdx: baseIdx, baseQty: item.baseQty, addons: addonsMap, mode: 'edit', cartIdx: cartIndex };
            renderModalContent();
        }

function renderModalContent() {
    let group = database[currentSelection.groupIdx];
    
    document.getElementById('esModalTitle').innerText = (currentSelection.mode === 'edit' ? "Редактирование" : esc(group.title));
    const btn = document.getElementById('esModalBtn');
    if(currentSelection.mode === 'edit') {
        btn.innerText = "Сохранить";
        btn.className = "bg-emerald-500 hover:bg-emerald-600 text-white px-6 py-3 rounded-xl font-bold transition-colors";
    } else {
        btn.innerText = "Добавить";
        btn.className = "bg-slate-900 hover:bg-slate-800 text-white px-6 py-3 rounded-xl font-bold transition-colors";
    }

    const bList = document.getElementById('esBasesList');
    bList.innerHTML = "";
    let bases = group.items.length ? group.items : [{name: "База", price:0}];
    
    bases.forEach((item, i) => {
        // ИЗМЕНЕНИЕ: проверяем item.isRequest
        let pText = item.isRequest ? "По запросу" : (item.isPercent ? `${item.price}%` : fmt(item.price));
        let isActive = (i === currentSelection.baseIdx);
        
        let activeClasses = isActive 
            ? "border-blue-600 bg-blue-50 ring-1 ring-blue-600 shadow-sm" 
            : "border-slate-200 bg-white hover:border-blue-300";
            
        let radioStyle = isActive 
            ? "border-[5px] border-blue-600 bg-white" 
            : "border-2 border-slate-300 bg-white";

        bList.innerHTML += `
            <div class="flex justify-between items-center p-3 rounded-xl border ${activeClasses} cursor-pointer transition-all" onclick="selectBase(${i})">
                <div class="flex items-center gap-3">
                    <div class="w-5 h-5 rounded-full flex-shrink-0 ${radioStyle} shadow-sm transition-all"></div>
                    <span class="font-semibold text-sm ${isActive ? 'text-blue-900' : 'text-slate-700'}">${esc(item.name)}</span>
                </div>
                <span class="font-extrabold text-sm whitespace-nowrap ml-3 ${isActive ? 'text-blue-600' : 'text-slate-900'}">${pText}</span>
            </div>`;
    });

    const aList = document.getElementById('esAddonsList');
    const aCont = document.getElementById('esAddonsContainer');
    aList.innerHTML = "";
    
    if(group.addons.length === 0) {
        aCont.classList.add('hidden');
    } else {
        aCont.classList.remove('hidden');
        group.addons.forEach((item, i) => {
            // ИЗМЕНЕНИЕ: проверяем item.isRequest
            let pText = item.isRequest ? "По запросу" : (item.isPercent ? `${item.price}%` : fmt(item.price));
            let qty = currentSelection.addons[i] || 0;
            let isActive = qty > 0;
            
            let activeClasses = isActive ? "border-blue-400 bg-blue-50/70 shadow-sm" : "border-slate-200 bg-white hover:border-blue-300";

            aList.innerHTML += `
                <div class="flex justify-between items-center p-3 rounded-xl border ${activeClasses} transition-colors">
                    <div class="flex flex-col">
                        <span class="font-semibold text-sm text-slate-700 leading-tight">${esc(item.name)}</span>
                        <span class="font-bold text-xs text-slate-500 mt-0.5">${pText}</span>
                    </div>
                    <div class="flex items-center gap-2 bg-white border border-slate-200 p-1 rounded-full shadow-sm ml-3 shrink-0">
                        <button class="w-6 h-6 flex items-center justify-center bg-slate-100 hover:bg-slate-200 rounded-full text-slate-600 font-bold transition-colors text-xs" onclick="changeAddonQty(${i}, -1)">-</button>
                        <span id="esAddonQty_${i}" class="w-4 text-center font-bold text-sm ${isActive ? 'text-slate-900' : 'text-slate-400'}">${qty}</span>
                        <button class="w-6 h-6 flex items-center justify-center bg-slate-100 hover:bg-slate-200 rounded-full text-slate-600 font-bold transition-colors text-xs" onclick="changeAddonQty(${i}, 1)">+</button>
                    </div>
                </div>`;
        });
    }
    
    document.getElementById('esBaseQtyVal').innerText = currentSelection.baseQty;
    
    const modal = document.getElementById('esModal');
    modal.classList.remove('hidden');
    modal.classList.add('flex');
    document.body.classList.add('modal-open');
    updateCalc();
}

        function closeModal() { 
            const modal = document.getElementById('esModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            document.body.classList.remove('modal-open'); 
        }

        window.selectBase = function(i) { currentSelection.baseIdx = i; renderModalContent(); }

        window.changeBaseQty = function(delta) {
            let newQty = currentSelection.baseQty + delta;
            if(newQty < 1) newQty = 1;
            currentSelection.baseQty = newQty;
            document.getElementById('esBaseQtyVal').innerText = newQty;
            updateCalc();
        }

        window.changeAddonQty = function(idx, delta) {
            let currentQty = currentSelection.addons[idx] || 0;
            let newQty = currentQty + delta;
            if(newQty < 0) newQty = 0;
            
            if(newQty === 0) delete currentSelection.addons[idx];
            else currentSelection.addons[idx] = newQty;
            
            let span = document.getElementById(`esAddonQty_${idx}`);
            span.innerText = newQty;
            if(newQty > 0) {
                span.classList.remove('text-slate-400'); span.classList.add('text-slate-900');
                span.parentElement.parentElement.classList.add('border-blue-400', 'bg-blue-50/70', 'shadow-sm');
                span.parentElement.parentElement.classList.remove('border-slate-200', 'bg-white');
            } else {
                span.classList.add('text-slate-400'); span.classList.remove('text-slate-900');
                span.parentElement.parentElement.classList.remove('border-blue-400', 'bg-blue-50/70', 'shadow-sm');
                span.parentElement.parentElement.classList.add('border-slate-200', 'bg-white');
            }
            updateCalc();
        }

function updateCalc() {
    let group = database[currentSelection.groupIdx];
    let base = group.items.length ? group.items[currentSelection.baseIdx] : {price:0};
    let total = 0; 
    let percentStr = "";
    let hasRequest = false;

    if(base.isRequest) {
        hasRequest = true;
    } else if(base.isPercent) {
        percentStr = ` + ${base.price}%`;
    } else {
        total += base.price * currentSelection.baseQty;
    }
    
    for (const [idx, qty] of Object.entries(currentSelection.addons)) {
        let add = group.addons[idx];
        if(add.isRequest) {
            hasRequest = true;
        } else if(add.isPercent) {
            percentStr += ` + ${add.price}%`;
        } else {
            total += add.price * qty;
        }
    }
    
    let finalStr = "";
    if (total === 0 && hasRequest) {
        finalStr = "По запросу" + percentStr;
    } else if (hasRequest) {
        finalStr = fmt(total) + " + По запросу" + percentStr;
    } else {
        finalStr = fmt(total) + percentStr;
    }
    
    document.getElementById('esModalPrice').innerText = finalStr;
}

        function confirmAddToCart() {
            let group = database[currentSelection.groupIdx];
            let baseItem = group.items.length ? group.items[currentSelection.baseIdx] : {name:"Товар", price:0, income:0};
            let selectedAddons = [];
            for (const [idx, qty] of Object.entries(currentSelection.addons)) {
                selectedAddons.push({ ...group.addons[idx], qty: qty });
            }
            
            catalogMemory[currentSelection.groupIdx] = {
                groupIdx: currentSelection.groupIdx, baseIdx: currentSelection.baseIdx,
                baseQty: currentSelection.baseQty, addons: {...currentSelection.addons}
            };

            let newItem = { title: group.title, base: baseItem, baseQty: currentSelection.baseQty, addons: selectedAddons };

            if(currentSelection.mode === 'edit') cart[currentSelection.cartIdx] = newItem;
            else cart.push(newItem);
            
            closeModal();
            renderCart();
            
            if(window.innerWidth <= 768 && cart.length === 1) {
                const widget = document.getElementById('esCartWidget');
                const arrow = document.getElementById('mobile-cart-arrow');
                widget.classList.add('is-open');
                arrow.style.transform = 'rotate(180deg)';
                setTimeout(() => { widget.classList.remove('is-open'); arrow.style.transform = 'rotate(0deg)'; }, 2500);
            }
        }

function renderCart() {
    let fixedSum = 0, fixedInc = 0;
    cart.forEach(c => {
        if(!c.base.isPercent && !c.base.isRequest) { fixedSum += c.base.price * c.baseQty; fixedInc += c.base.income * c.baseQty; }
        c.addons.forEach(a => { if(!a.isPercent && !a.isRequest) { fixedSum += a.price * a.qty; fixedInc += a.income * a.qty; } });
    });

    let total = fixedSum, totalInc = fixedInc;
    const list = document.getElementById('esCartItems');
    list.innerHTML = "";

    cart.forEach((c, idx) => {
        let itemTotalCost = 0; 
        let basePriceText = "";
        let itemHasRequest = false; // Флаг для конкретного товара

        if (c.base.isRequest) {
            itemHasRequest = true;
            basePriceText = `По запросу${c.baseQty > 1 ? ' (x' + c.baseQty + ')' : ''}`;
        } else if(c.base.isPercent) {
            let oneItemVal = fixedSum * (c.base.price / 100); let allItemsVal = oneItemVal * c.baseQty;
            total += allItemsVal; totalInc += (fixedSum * (c.base.income / 100)) * c.baseQty;
            itemTotalCost = allItemsVal; basePriceText = `${c.base.price}% (${fmt(oneItemVal)} x ${c.baseQty})`;
        } else {
            itemTotalCost = c.base.price * c.baseQty; basePriceText = `${fmt(c.base.price)} x ${c.baseQty}`;
        }

        let addonsHtml = "";
        c.addons.forEach(a => {
            let aText = "", aCost = 0;
            if (a.isRequest) {
                itemHasRequest = true;
                aText = `По запросу${a.qty > 1 ? ' (x' + a.qty + ')' : ''}`;
            } else if(a.isPercent) {
                let oneVal = fixedSum * (a.price / 100); let allVal = oneVal * a.qty;
                total += allVal; totalInc += (fixedSum * (a.income / 100)) * a.qty;
                aCost = allVal; aText = `${a.price}% (${fmt(oneVal)}) x ${a.qty}`;
            } else {
                aCost = a.price * a.qty; aText = `${fmt(a.price)} x ${a.qty}`;
            }
            itemTotalCost += aCost;
            addonsHtml += `<div class="text-xs text-slate-500 mb-0.5"><span class="text-slate-400">+</span> ${esc(a.name)}: ${aText}</div>`;
        });

        // ИЗМЕНЕНИЕ: Текст суммы для конкретной карточки в корзине
        let rowTotalText = "";
        if (itemTotalCost === 0 && itemHasRequest) {
            rowTotalText = "По запросу";
        } else if (itemHasRequest) {
            rowTotalText = fmt(itemTotalCost) + " + По запросу";
        } else {
            rowTotalText = fmt(itemTotalCost);
        }

        let row = document.createElement('div');
        row.className = 'bg-white p-4 rounded-[1rem] border border-slate-100 shadow-[0_2px_10px_-2px_rgba(0,0,0,0.03)] mb-3 relative cursor-pointer hover:border-blue-300 transition-colors group';
        row.onclick = () => openModalFromCart(idx);
        
        row.innerHTML = `
            <button class="absolute top-2 right-2 text-slate-300 hover:text-rose-500 transition-colors p-2 rounded-lg opacity-100 md:opacity-0 group-hover:opacity-100 focus:opacity-100" onclick="removeFromCart(event, ${idx})">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            <div class="font-bold text-slate-800 text-sm pr-6 mb-1 leading-tight">${esc(c.title)}</div>
            <div class="text-xs font-semibold text-slate-500 mb-1">${esc(c.base.name)} — ${basePriceText}</div>
            ${addonsHtml ? `<div class="mt-2 mb-2 pl-2 border-l-2 border-slate-100">${addonsHtml}</div>` : ''}
            <div class="mt-3 flex justify-between items-center pt-3 border-t border-slate-100 border-dashed">
                <span class="text-[10px] uppercase font-bold tracking-wider text-slate-400">Сумма</span>
                <span class="font-extrabold text-sm text-slate-900">${rowTotalText}</span>
            </div>
        `;
        list.appendChild(row);
    });
    
    if(cart.length===0) list.innerHTML = "<div class='text-center py-8 text-slate-400 font-medium text-sm'>Корзина пуста</div>";
    
    // ИЗМЕНЕНИЕ: Глобальный расчет "Итого"
    let globalHasRequest = cart.some(c => c.base.isRequest || c.addons.some(a => a.isRequest));
    let globalTotalText = "";
    if (total === 0 && globalHasRequest) {
        globalTotalText = "По запросу";
    } else if (globalHasRequest) {
        globalTotalText = fmt(total) + " + По запросу";
    } else {
        globalTotalText = fmt(total);
    }

    document.getElementById('esTotalSum').innerText = globalTotalText;
    document.getElementById('esTotalIncome').innerText = fmt(totalInc);
    
    const badge = document.getElementById('cart-count-badge');
    if(cart.length > 0) { badge.innerText = cart.length; badge.classList.remove('hidden'); } 
    else { badge.classList.add('hidden'); }
}

        window.removeFromCart = function(e, i) { 
            e.stopPropagation(); let item = cart[i]; let groupIdx = database.findIndex(g => g.title === item.title);
            if (groupIdx !== -1) delete catalogMemory[groupIdx];
            cart.splice(i, 1); renderCart(); 
        }

        window.clearCart = function(e) { 
            if(e) e.stopPropagation(); cart = []; catalogMemory = {}; renderCart(); 
            if(window.innerWidth <= 768) {
                document.getElementById('esCartWidget').classList.remove('is-open');
                document.getElementById('mobile-cart-arrow').style.transform = 'rotate(0deg)';
            }
        }

        window.toggleMobileCart = function() {
            if(window.innerWidth <= 768) {
                const widget = document.getElementById('esCartWidget');
                const arrow = document.getElementById('mobile-cart-arrow');
                widget.classList.toggle('is-open');
                arrow.style.transform = widget.classList.contains('is-open') ? 'rotate(180deg)' : 'rotate(0deg)';
            }
        }

        document.getElementById('esSearch').addEventListener('input', (e) => renderCatalog(e.target.value));

        // ============================================
        // ЛОГИКА СКРЫТИЯ/ПОКАЗА НАВИГАЦИИ ПРИ СКРОЛЛЕ
        // ============================================
        let lastScrollTop = 0;
        const portalNav = document.getElementById('portal-nav');

        if (portalNav) {
            const initScrollLayout = () => {
                const navH = portalNav.offsetHeight;
                document.body.style.setProperty('--nav-h', navH + 'px');
                
                document.querySelectorAll('.scroll-area').forEach(area => {
                    let spacer = area.querySelector('.safe-spacer');
                    if (!spacer) {
                        spacer = document.createElement('div');
                        spacer.className = 'safe-spacer shrink-0 w-full';
                        area.insertBefore(spacer, area.firstChild);
                    }
                    spacer.style.height = navH + 'px';
                });
            };

            setTimeout(initScrollLayout, 50);
            window.addEventListener('resize', initScrollLayout);

            document.querySelectorAll('.scroll-area').forEach(scrollArea => {
                scrollArea.addEventListener('scroll', function() {
                    let currentScroll = this.scrollTop;
                    let maxScroll = this.scrollHeight - this.clientHeight;
                    
                    if (currentScroll <= 0 || currentScroll >= maxScroll - 5) return;
                    if (Math.abs(currentScroll - lastScrollTop) <= 5) return;

                    if (currentScroll > lastScrollTop && currentScroll > 50) {
                        portalNav.style.transform = 'translateY(-100%)'; 
                        document.body.classList.add('nav-hidden');
                    } else {
                        portalNav.style.transform = 'translateY(0)'; 
                        document.body.classList.remove('nav-hidden');
                    }
                    
                    lastScrollTop = currentScroll;
                }, { passive: true });
            });
        }
        // ==========================================================
        // PERFORMANCE & UX PATCH v1.0
        // ==========================================================
        (() => {
            const CACHE_KEY_CSV = 'es_catalog_csv_cache_v1';
            const CACHE_KEY_CART = 'es_catalog_cart_v1';
            const CACHE_KEY_MEM = 'es_catalog_mem_v1';

            // 1. Быстрый синглтон форматирования чисел (в 50 раз быстрее new Intl.NumberFormat на каждый вызов)
            const _RU_FMT = new Intl.NumberFormat('ru-RU');
            fmt = (n) => _RU_FMT.format(Math.round((+n || 0) * 100) / 100) + ' ₽';

            let _catalogCards = [];
            let _emptyStateEl = null;
            let _mobileCartTimer = null;
            let _lastCsvHash = '';

            // 2. Восстановление и сохранение корзины между вкладками портала
            function _loadPersistedCart() {
                try {
                    const savedCart = sessionStorage.getItem(CACHE_KEY_CART);
                    const savedMem = sessionStorage.getItem(CACHE_KEY_MEM);
                    if (savedCart) cart = JSON.parse(savedCart) || [];
                    if (savedMem) catalogMemory = JSON.parse(savedMem) || {};
                } catch (e) {}
            }

            function _savePersistedCart() {
                try {
                    sessionStorage.setItem(CACHE_KEY_CART, JSON.stringify(cart));
                    sessionStorage.setItem(CACHE_KEY_MEM, JSON.stringify(catalogMemory));
                } catch (e) {}
            }

            // 3. Предварительная индексация данных и защита от Infinity в ценах
            processData = function(rows) {
                if (!rows || !rows.length) return;

                // Проверка хэша, чтобы не перерисовывать каталог, если фоновый CSV не изменился
                const rawHash = JSON.stringify(rows);
                if (rawHash === _lastCsvHash && database.length > 0) return;
                _lastCsvHash = rawHash;

                try {
                    sessionStorage.setItem(CACHE_KEY_CSV, rawHash);
                } catch (e) {}

                database = [];
                let currentGroup = null;
                let isAddons = false;

                for (let r = 0; r < rows.length; r++) {
                    const row = rows[r];
                    if (!row || !row[COL_NAME]) continue;
                    const name = String(row[COL_NAME]).trim();
                    if (name === "") continue;

                    const nameLower = name.toLowerCase();
                    const priceRaw = row[COL_PRICE];
                    const isHeader = (!priceRaw || String(priceRaw).trim() === "")
                        && !nameLower.includes("позиция")
                        && !nameLower.includes("себестоимость");

                    if (nameLower.includes("доп. элементы")) {
                        isAddons = true;
                        continue;
                    }

                    if (isHeader) {
                        currentGroup = { title: name, items: [], addons: [] };
                        database.push(currentGroup);
                        isAddons = false;
                    } else if (currentGroup && !nameLower.includes("позиция")) {
                        const p = parsePrice(row[COL_PRICE]);
                        const inc = parsePrice(row[COL_INCOME]);
                        const item = { name, price: p.val, isPercent: p.isPercent, isRequest: p.isRequest, income: inc.val };

                        if (isAddons) currentGroup.addons.push(item);
                        else currentGroup.items.push(item);
                    }
                }

                database = database.filter(g => g.items.length > 0 || g.addons.length > 0);

                // Предварительный расчет поискового индекса и минимальной цены 1 раз
                database.forEach(group => {
                    const validPrices = [];
                    for (let i = 0; i < group.items.length; i++) {
                        const it = group.items[i];
                        if (!it.isPercent && !it.isRequest && it.price > 0) {
                            validPrices.push(it.price);
                        }
                    }
                    const minP = validPrices.length > 0 ? Math.min(...validPrices) : 0;
                    group._priceText = minP > 0
                        ? `от ${fmt(minP)}`
                        : (group.items.some(i => i.isPercent) ? "Расчет %" : "По запросу");

                    group._searchStr = (
                        group.title + ' ' +
                        group.items.map(i => i.name).join(' ') + ' ' +
                        group.addons.map(a => a.name).join(' ')
                    ).toLowerCase();
                });

                _buildCatalogDOMOnce();
                const searchInput = document.getElementById('esSearch');
                renderCatalog(searchInput ? searchInput.value : "");
            };

            // 4. Создание DOM-дерева каталога один раз через DocumentFragment
            function _buildCatalogDOMOnce() {
                const grid = document.getElementById('esGrid');
                if (!grid) return;

                const frag = document.createDocumentFragment();
                _catalogCards = [];

                database.forEach((group, idx) => {
                    const card = document.createElement('div');
                    card.className = 'bg-white p-4 sm:p-5 rounded-[1.5rem] border border-slate-200 shadow-[0_4px_20px_-2px_rgba(0,0,0,0.03)] hover:border-blue-400 hover:shadow-[0_8px_25px_-5px_rgba(0,0,0,0.06)] hover:-translate-y-1 transition-all duration-300 cursor-pointer flex flex-col justify-between min-h-[120px] relative group';
                    card.onclick = () => openModalFromCatalog(idx);
                    card.innerHTML = `
                        <div class="font-bold text-slate-800 text-sm sm:text-base leading-snug mb-3 group-hover:text-blue-700 transition-colors">${esc(group.title)}</div>
                        <div class="mt-auto font-extrabold text-blue-600 text-base">${group._priceText}</div>
                    `;
                    frag.appendChild(card);
                    _catalogCards.push({ el: card, searchStr: group._searchStr });
                });

                _emptyStateEl = document.createElement('div');
                _emptyStateEl.className = 'col-span-full text-center text-slate-500 py-10 font-medium hidden';
                _emptyStateEl.textContent = 'Ничего не найдено';
                frag.appendChild(_emptyStateEl);

                grid.innerHTML = '';
                grid.appendChild(frag);
            }

            // 5. Мгновенная фильтрация без пересоздания DOM-узлов (< 0.5 мс)
            renderCatalog = function(filter = "") {
                if (_catalogCards.length === 0 && database.length > 0) {
                    _buildCatalogDOMOnce();
                }
                const lower = filter.trim().toLowerCase();
                let visibleCount = 0;

                for (let i = 0; i < _catalogCards.length; i++) {
                    const item = _catalogCards[i];
                    const match = !lower || item.searchStr.includes(lower);
                    item.el.classList.toggle('hidden', !match);
                    if (match) visibleCount++;
                }

                if (_emptyStateEl) {
                    _emptyStateEl.classList.toggle('hidden', visibleCount > 0 || database.length === 0);
                }
            };

            // 6. Оптимизированный рендер модалки без innerHTML += в цикле и без перерисовки при смене базы
            renderModalContent = function() {
                const group = database[currentSelection.groupIdx];
                if (!group) return;

                // Исправлено: innerText сам экранирует спецсимволы, esc() здесь вызывал баг с &quot;
                document.getElementById('esModalTitle').innerText = (currentSelection.mode === 'edit' ? "Редактирование" : group.title);
                const btn = document.getElementById('esModalBtn');
                if (currentSelection.mode === 'edit') {
                    btn.innerText = "Сохранить";
                    btn.className = "bg-emerald-500 hover:bg-emerald-600 text-white px-6 py-3 rounded-xl font-bold transition-colors";
                } else {
                    btn.innerText = "Добавить";
                    btn.className = "bg-slate-900 hover:bg-slate-800 text-white px-6 py-3 rounded-xl font-bold transition-colors";
                }

                const bList = document.getElementById('esBasesList');
                const bases = group.items.length ? group.items : [{ name: "База", price: 0 }];

                bList.innerHTML = bases.map((item, i) => {
                    const pText = item.isRequest ? "По запросу" : (item.isPercent ? `${item.price}%` : fmt(item.price));
                    const isActive = (i === currentSelection.baseIdx);
                    const activeClasses = isActive
                        ? "border-blue-600 bg-blue-50 ring-1 ring-blue-600 shadow-sm"
                        : "border-slate-200 bg-white hover:border-blue-300";
                    const radioStyle = isActive
                        ? "border-[5px] border-blue-600 bg-white"
                        : "border-2 border-slate-300 bg-white";

                    return `
                        <div data-base-row="${i}" class="flex justify-between items-center p-3 rounded-xl border ${activeClasses} cursor-pointer transition-all" onclick="selectBase(${i})">
                            <div class="flex items-center gap-3">
                                <div data-base-radio="${i}" class="w-5 h-5 rounded-full flex-shrink-0 ${radioStyle} shadow-sm transition-all"></div>
                                <span data-base-title="${i}" class="font-semibold text-sm ${isActive ? 'text-blue-900' : 'text-slate-700'}">${esc(item.name)}</span>
                            </div>
                            <span data-base-price="${i}" class="font-extrabold text-sm whitespace-nowrap ml-3 ${isActive ? 'text-blue-600' : 'text-slate-900'}">${pText}</span>
                        </div>`;
                }).join('');

                const aList = document.getElementById('esAddonsList');
                const aCont = document.getElementById('esAddonsContainer');

                if (group.addons.length === 0) {
                    aCont.classList.add('hidden');
                    aList.innerHTML = "";
                } else {
                    aCont.classList.remove('hidden');
                    aList.innerHTML = group.addons.map((item, i) => {
                        const pText = item.isRequest ? "По запросу" : (item.isPercent ? `${item.price}%` : fmt(item.price));
                        const qty = currentSelection.addons[i] || 0;
                        const isActive = qty > 0;
                        const activeClasses = isActive ? "border-blue-400 bg-blue-50/70 shadow-sm" : "border-slate-200 bg-white hover:border-blue-300";

                        return `
                            <div class="flex justify-between items-center p-3 rounded-xl border ${activeClasses} transition-colors">
                                <div class="flex flex-col">
                                    <span class="font-semibold text-sm text-slate-700 leading-tight">${esc(item.name)}</span>
                                    <span class="font-bold text-xs text-slate-500 mt-0.5">${pText}</span>
                                </div>
                                <div class="flex items-center gap-2 bg-white border border-slate-200 p-1 rounded-full shadow-sm ml-3 shrink-0">
                                    <button class="w-6 h-6 flex items-center justify-center bg-slate-100 hover:bg-slate-200 rounded-full text-slate-600 font-bold transition-colors text-xs" onclick="changeAddonQty(${i}, -1)">-</button>
                                    <span id="esAddonQty_${i}" class="w-4 text-center font-bold text-sm ${isActive ? 'text-slate-900' : 'text-slate-400'}">${qty}</span>
                                    <button class="w-6 h-6 flex items-center justify-center bg-slate-100 hover:bg-slate-200 rounded-full text-slate-600 font-bold transition-colors text-xs" onclick="changeAddonQty(${i}, 1)">+</button>
                                </div>
                            </div>`;
                    }).join('');
                }

                document.getElementById('esBaseQtyVal').innerText = currentSelection.baseQty;

                const modal = document.getElementById('esModal');
                modal.classList.remove('hidden');
                modal.classList.add('flex');
                document.body.classList.add('modal-open');
                updateCalc();
            };

            // Точечное переключение радиокнопки базы без пересборки DOM модального окна
            window.selectBase = function(newIdx) {
                if (!currentSelection || currentSelection.baseIdx === newIdx) return;
                const prevIdx = currentSelection.baseIdx;
                currentSelection.baseIdx = newIdx;

                const bList = document.getElementById('esBasesList');
                const toggleRow = (idx, active) => {
                    const row = bList.querySelector(`[data-base-row="${idx}"]`);
                    const radio = bList.querySelector(`[data-base-radio="${idx}"]`);
                    const title = bList.querySelector(`[data-base-title="${idx}"]`);
                    const price = bList.querySelector(`[data-base-price="${idx}"]`);
                    if (!row) return;
                    row.className = `flex justify-between items-center p-3 rounded-xl border ${active ? 'border-blue-600 bg-blue-50 ring-1 ring-blue-600 shadow-sm' : 'border-slate-200 bg-white hover:border-blue-300'} cursor-pointer transition-all`;
                    if (radio) radio.className = `w-5 h-5 rounded-full flex-shrink-0 ${active ? 'border-[5px] border-blue-600 bg-white' : 'border-2 border-slate-300 bg-white'} shadow-sm transition-all`;
                    if (title) title.className = `font-semibold text-sm ${active ? 'text-blue-900' : 'text-slate-700'}`;
                    if (price) price.className = `font-extrabold text-sm whitespace-nowrap ml-3 ${active ? 'text-blue-600' : 'text-slate-900'}`;
                };

                toggleRow(prevIdx, false);
                toggleRow(newIdx, true);
                updateCalc();
            };

            // 7. Батч-рендер корзины и фикс таймера закрытия на мобильных
            const _origRenderCart = renderCart;
            renderCart = function() {
                _origRenderCart();
                _savePersistedCart();
            };

            confirmAddToCart = function() {
                const group = database[currentSelection.groupIdx];
                const baseItem = group.items.length ? group.items[currentSelection.baseIdx] : { name: "Товар", price: 0, income: 0 };
                const selectedAddons = [];
                for (const [idx, qty] of Object.entries(currentSelection.addons)) {
                    selectedAddons.push({ ...group.addons[idx], qty: qty });
                }

                catalogMemory[currentSelection.groupIdx] = {
                    groupIdx: currentSelection.groupIdx,
                    baseIdx: currentSelection.baseIdx,
                    baseQty: currentSelection.baseQty,
                    addons: { ...currentSelection.addons }
                };

                const newItem = { title: group.title, base: baseItem, baseQty: currentSelection.baseQty, addons: selectedAddons };

                if (currentSelection.mode === 'edit') cart[currentSelection.cartIdx] = newItem;
                else cart.push(newItem);

                closeModal();
                renderCart();

                if (window.innerWidth <= 768 && cart.length === 1) {
                    const widget = document.getElementById('esCartWidget');
                    const arrow = document.getElementById('mobile-cart-arrow');
                    widget.classList.add('is-open');
                    arrow.style.transform = 'rotate(180deg)';
                    if (_mobileCartTimer) clearTimeout(_mobileCartTimer);
                    _mobileCartTimer = setTimeout(() => {
                        widget.classList.remove('is-open');
                        arrow.style.transform = 'rotate(0deg)';
                        _mobileCartTimer = null;
                    }, 2500);
                }
            };

            window.toggleMobileCart = function() {
                if (_mobileCartTimer) {
                    clearTimeout(_mobileCartTimer);
                    _mobileCartTimer = null;
                }
                if (window.innerWidth <= 768) {
                    const widget = document.getElementById('esCartWidget');
                    const arrow = document.getElementById('mobile-cart-arrow');
                    widget.classList.toggle('is-open');
                    arrow.style.transform = widget.classList.contains('is-open') ? 'rotate(180deg)' : 'rotate(0deg)';
                }
            };

            // 8. Оптимизация скролла через requestAnimationFrame без Layout Thrashing
            document.querySelectorAll('.scroll-area').forEach( area => {
                let ticking = false;
                let isNavHidden = false;
                let prevScroll = 0;

                area.addEventListener('scroll', function() {
                    const currentScroll = this.scrollTop;
                    if (!ticking) {
                        window.requestAnimationFrame(() => {
                            const delta = currentScroll - prevScroll;
                            if (currentScroll > 50 && delta > 6 && !isNavHidden) {
                                isNavHidden = true;
                                if (portalNav) portalNav.style.transform = 'translateY(-100%)';
                                document.body.classList.add('nav-hidden');
                            } else if ((delta < -6 || currentScroll <= 20) && isNavHidden) {
                                isNavHidden = false;
                                if (portalNav) portalNav.style.transform = 'translateY(0)';
                                document.body.classList.remove('nav-hidden');
                            }
                            prevScroll = Math.max(0, currentScroll);
                            ticking = false;
                        });
                        ticking = true;
                    }
                }, { passive: true });
            });

            // 9. Мгновенный старт из кэша (0 мс) параллельно с фоновым обновлением PapaParse
            _loadPersistedCart();
            try {
                const cachedCsv = sessionStorage.getItem(CACHE_KEY_CSV);
                if (cachedCsv) {
                    const parsedRows = JSON.parse(cachedCsv);
                    if (Array.isArray(parsedRows) && parsedRows.length > 0) {
                        processData(parsedRows);
                    }
                }
            } catch (e) {}
            if (cart.length > 0) renderCart();
        })();
    </script>
</body>
</html>
