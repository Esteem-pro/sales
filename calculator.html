<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Калькулятор доставки | Единый портал продавца</title>
    
    <!-- Шрифты и библиотеки -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- ПРОВЕРКА АВТОРИЗАЦИИ -->
    <script>
        if (!localStorage.getItem('sales_dash_user') || !localStorage.getItem('sales_dash_pass')) {
            window.location.replace('index.html');
        }
    </script>

    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f1f5f9; 
            color: #0f172a; 
            height: 100dvh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            touch-action: manipulation;
            -webkit-font-smoothing: antialiased;
        }
        button, input, select, textarea { touch-action: manipulation; }

        .scroll-area { flex: 1; overflow-y: auto; padding-bottom: calc(env(safe-area-inset-bottom) + 120px); }
        .scroll-area::-webkit-scrollbar { width: 6px; }
        .scroll-area::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        body.modal-open { overflow: hidden; touch-action: none; }

        /* Динамическое позиционирование липких элементов */
        #search-container {
            top: calc(var(--nav-h, 60px) + 16px);
            transition: top 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        body.nav-hidden #search-container {
            top: 16px;
        }

        @media (min-width: 768px) {
            #esCartWidget {
                top: calc(var(--nav-h, 60px) + 90px);
                transition: top 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            }
            body.nav-hidden #esCartWidget {
                top: 90px;
            }
        }

        @media (max-width: 768px) {
            .mobile-cart-sheet { max-height: 62px; transition: max-height 0.4s cubic-bezier(0.2, 1, 0.3, 1); }
            .mobile-cart-sheet.is-open { max-height: 75dvh; }
            .mobile-cart-content { opacity: 0; pointer-events: none; transition: opacity 0.2s ease; }
            .mobile-cart-sheet.is-open .mobile-cart-content { opacity: 1; pointer-events: auto; transition: opacity 0.3s ease 0.15s; }
            .mobile-cart-sheet:not(.is-open) .cart-header-border { border-color: transparent; }
        }
    </style>
</head>
<body>

    <!-- ОБЩЕПОРТАЛЬНАЯ НАВИГАЦИЯ -->
    <nav id="portal-nav" class="fixed top-0 left-0 w-full bg-slate-900 text-white px-3 sm:px-4 pb-3 pt-[calc(env(safe-area-inset-top,0px)+12px)] flex justify-between items-center gap-2 z-[60] transition-transform duration-300">
        <div class="flex gap-1 sm:gap-2 font-semibold text-[13px] sm:text-sm">
            <a href="index.html" class="px-3 py-2 rounded-lg transition-colors hover:bg-white/10 text-slate-300">Аналитика</a>
            <a href="catalog.html" class="px-3 py-2 rounded-lg transition-colors hover:bg-white/10 text-slate-300">Прайс</a>
            <a href="calculator.html" class="px-3 py-2 rounded-lg transition-colors bg-white/20 text-white">Доставка</a>
            <a href="materials.html" class="px-3 py-2 rounded-lg transition-colors hover:bg-white/10 text-slate-300 whitespace-nowrap">Рабочие материалы</a>
        </div>
        <button onclick="logout()" class="p-2 bg-rose-500/20 text-rose-400 hover:bg-rose-500 hover:text-white rounded-lg transition shrink-0" aria-label="Выйти">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
        </button>
    </nav>

    <!-- ОБЛАСТЬ ПРОКРУТКИ -->
    <div class="scroll-area flex flex-col w-full relative">

        <div class="max-w-7xl mx-auto px-4 sm:px-6 mt-6 sm:mt-8 flex flex-col md:flex-row gap-6 items-start w-full">
            
            <div class="flex-1 w-full">
                <!-- Липкий заголовок -->
                <div id="search-container" class="sticky z-40 w-full pointer-events-none mb-4">
                    <div class="relative shadow-[0_8px_30px_rgb(0,0,0,0.06)] rounded-[1.2rem] bg-white/80 backdrop-blur-xl border border-white/60 px-5 py-4 flex items-center justify-between pointer-events-auto w-full">
                        <h1 class="font-extrabold text-slate-800 text-lg">Калькулятор доставки</h1>
                        <button onclick="openItemModal(-1)" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-sm transition">
                            + Добавить
                        </button>
                    </div>
                </div>

                <!-- ИНФОРМАЦИОННАЯ ПЛАШКА -->
                <div class="mb-6 bg-indigo-50/80 border border-indigo-100 text-indigo-800 text-sm p-4 rounded-[1.2rem] shadow-sm flex items-start gap-3">
                    <svg class="w-6 h-6 shrink-0 text-indigo-500 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <p class="leading-relaxed font-medium">Сумма доставки из Москвы до получателя рассчитывается и оплачивается в компанию СДЭК получателем при получении посылки.</p>
                </div>

                <div id="calcGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 sm:gap-5">
                    <!-- Карточки генерируются через JS -->
                </div>
            </div>

            <!-- ИТОГИ (ОСТРОВОК) -->
            <div id="esCartWidget" class="mobile-cart-sheet md:transform-none fixed md:sticky bottom-4 inset-x-0 md:bottom-auto z-50 md:z-10 w-full md:w-80 lg:w-96 bg-transparent flex flex-col mx-auto px-4 sm:px-6 md:px-0 md:max-h-[calc(100vh-130px)]">
                
                <div class="bg-white rounded-[1.2rem] md:rounded-[1.5rem] border border-slate-200/80 shadow-[0_12px_40px_-10px_rgba(0,0,0,0.15)] md:shadow-[0_4px_20px_-2px_rgba(0,0,0,0.03)] flex flex-col flex-1 min-h-0 overflow-hidden">
                    
                    <div class="cart-header-border p-4 sm:p-5 border-b border-slate-100 flex justify-between items-center bg-slate-900 md:bg-white text-white md:text-slate-900 cursor-pointer md:cursor-default transition-colors shrink-0 touch-none md:touch-auto" onclick="toggleMobileCart()">
                        <div class="flex items-center gap-2">
                            <h2 class="font-extrabold text-lg">Расчет стоимости</h2>
                            <span id="cart-count-badge" class="bg-blue-500 md:bg-slate-100 md:text-slate-600 text-white text-xs font-bold px-2 py-0.5 rounded-full hidden">0</span>
                        </div>
                        <svg id="mobile-cart-arrow" class="w-6 h-6 md:hidden transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path></svg>
                    </div>

                    <div class="mobile-cart-content flex flex-col flex-1 overflow-hidden min-h-0">
                        <div id="esCartItems" class="flex-1 overflow-y-auto overscroll-y-contain p-4 sm:p-5 bg-[#f1f5f9]/50">
                            <div class="text-center py-8 text-slate-400 font-medium text-sm">Добавьте позиции</div>
                        </div>

                        <div class="p-4 sm:p-5 bg-white border-t border-slate-100 shrink-0">
                            <div class="flex justify-between items-end mb-4">
                                <span class="text-slate-500 font-bold mb-1 shrink-0">Итого к оплате:</span>
                                <span id="calcTotalSum" class="text-2xl font-extrabold text-slate-900 tracking-tight truncate">0 ₽</span>
                            </div>
                            
                            <button class="w-full bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold p-3 rounded-[1rem] transition-colors text-sm" onclick="clearCalculator(event)">
                                Сбросить расчет
                            </button>
                        </div>
                        
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- УНИВЕРСАЛЬНАЯ МОДАЛКА (ДОБАВЛЕНИЕ / РЕДАКТИРОВАНИЕ) -->
    <div id="itemModal" class="hidden fixed inset-0 z-[100] bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-md p-6 shadow-xl relative">
            <h3 id="modalTitle" class="text-xl font-bold mb-4">Новая позиция</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-600 mb-1">Название</label>
                    <input type="text" id="modalItemName" class="w-full border border-slate-200 rounded-lg p-2.5 outline-none focus:border-blue-500 font-medium" placeholder="Например: Спец. коврик">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-slate-600 mb-1">Цена (₽)</label>
                        <input type="number" id="modalItemPrice" class="w-full border border-slate-200 rounded-lg p-2.5 outline-none focus:border-blue-500 font-medium" value="0">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-600 mb-1">Вес, кг <span class="text-slate-400 font-normal">(необяз.)</span></label>
                        <input type="number" id="modalItemWeight" class="w-full border border-slate-200 rounded-lg p-2.5 outline-none focus:border-blue-500 font-medium" step="0.1" placeholder="0">
                    </div>
                </div>
            </div>
            <div class="flex gap-3 mt-6">
                <button onclick="closeItemModal()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2.5 rounded-xl transition">Отмена</button>
                <button onclick="saveItem()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-xl transition">Сохранить</button>
            </div>
        </div>
    </div>

    <script>
        function logout() {
            localStorage.removeItem('sales_dash_user');
            localStorage.removeItem('sales_dash_pass');
            localStorage.removeItem('sales_dash_data');
            window.location.href = 'index.html';
        }

        // Обновленная структура данных (пересчитанные базовые цены)
        let deliveryItems = [
            { name: "2д комплект 2 ряда", weight: 6, price: 4283, qty: 0 },
            { name: "2д комплект 3 ряда", weight: 7, price: 4283, qty: 0 },
            { name: "3д комплект", weight: 10, price: 4283, qty: 0 },
            { name: "3д комплект с багажником", weight: 12, price: 4900, qty: 0 },
            { name: "Коврики для минивэна", weight: 15, price: 5500, qty: 0 },
            { name: "Коврик багажник", weight: 2, price: 2900, qty: 0 },
            { name: "Багажный ковёр + защита бортов", weight: 2.4, price: 3480, qty: 0 },
            { name: "Сумка", weight: 3, price: 2600, qty: 0 },
            { name: "Органайзер", weight: 8, price: 3100, qty: 0 },
            { name: "Чемодан", weight: 5, price: 2500, qty: 0 },
            { name: "Ложка длинная без тубуса", weight: 1.5, price: 1600, qty: 0 },
            { name: "Ложка длинная с тубусом", weight: 2.5, price: 800, qty: 0 },
            { name: "Картина 50х70", weight: 5, price: 4000, qty: 0 },
            { name: "Бустер детский", weight: 5, price: 2200, qty: 0 },
            { name: "Каска", weight: 1.5, price: 1800, qty: 0 },
            { name: "Номерная рамка", weight: 1, price: 1700, qty: 0 },
            { name: "Чехол на ключ", weight: 0, price: 804, qty: 0 },
            { name: "Подушка", weight: 0, price: 1022, qty: 0 },
            { name: "Багажный ковер-трансформер", weight: 0, price: 3848, qty: 0 },
            { name: "Защита спинок сидений", weight: 0, price: 2109, qty: 0 }
        ];

        let editingIdx = -1; // -1 означает добавление новой, >= 0 означает редактирование

        const fmt = (n) => new Intl.NumberFormat('ru-RU').format(Math.round(n)) + ' ₽';
        
        function renderItems() {
            const grid = document.getElementById('calcGrid');
            grid.innerHTML = '';
            
            deliveryItems.forEach((item, idx) => {
                let card = document.createElement('div');
                card.className = 'bg-white p-4 sm:p-5 rounded-[1.5rem] border border-slate-200 shadow-[0_4px_20px_-2px_rgba(0,0,0,0.03)] flex flex-col justify-between transition-all hover:border-blue-400 hover:shadow-[0_8px_25px_-5px_rgba(0,0,0,0.06)] relative group';
                
                const weightHtml = (item.weight && item.weight > 0) 
                    ? `<div class="text-slate-400 text-xs">${item.weight} кг</div>` 
                    : `<div class="text-transparent text-xs select-none">0 кг</div>`; // Держим высоту строки

                // Отрисовка карточки с возможностью редактирования цены прямо в ней
                card.innerHTML = `
                    <button onclick="openItemModal(${idx})" class="absolute top-4 right-4 text-slate-300 hover:text-blue-600 transition-colors p-1 rounded-md hover:bg-blue-50" title="Редактировать позицию">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                    </button>

                    <div class="pr-8 mb-3">
                        <div class="font-bold text-slate-800 text-sm sm:text-base leading-snug mb-1">${item.name}</div>
                        ${weightHtml}
                    </div>
                    
                    <div class="flex items-center gap-2 mb-4">
                        <span class="text-slate-500 text-sm font-medium">Цена:</span>
                        <input type="number" value="${item.price}" onchange="updateItemPrice(${idx}, this.value)" class="w-24 bg-slate-50 border border-slate-200 rounded-lg px-2 py-1 outline-none focus:border-blue-500 font-bold text-slate-800 text-sm transition text-right">
                        <span class="text-slate-500 text-sm font-bold">₽</span>
                    </div>

                    <div class="flex items-center justify-between mt-auto pt-4 border-t border-slate-100">
                        <span class="font-extrabold text-blue-600 text-base">${fmt(item.price * (item.qty > 0 ? item.qty : 1))}</span>
                        <div class="flex items-center gap-2 bg-slate-50 border border-slate-200 p-1 rounded-full shadow-sm">
                            <button class="w-8 h-8 flex items-center justify-center bg-white hover:bg-slate-100 rounded-full text-slate-600 font-bold transition-colors shadow-sm text-lg" onclick="changeQty(${idx}, -1)">-</button>
                            <span class="w-6 text-center font-bold ${item.qty > 0 ? 'text-slate-900' : 'text-slate-400'} text-sm">${item.qty}</span>
                            <button class="w-8 h-8 flex items-center justify-center bg-white hover:bg-slate-100 rounded-full text-slate-600 font-bold transition-colors shadow-sm text-lg" onclick="changeQty(${idx}, 1)">+</button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Прямое обновление цены из инпута на карточке
        function updateItemPrice(idx, newValue) {
            let parsed = parseFloat(newValue);
            if (isNaN(parsed) || parsed < 0) parsed = 0;
            deliveryItems[idx].price = parsed;
            renderItems();
            updateSummary();
        }

        function changeQty(idx, delta) {
            let item = deliveryItems[idx];
            let newQty = item.qty + delta;
            if(newQty < 0) newQty = 0;
            
            let totalQtyBefore = deliveryItems.reduce((sum, i) => sum + i.qty, 0);
            item.qty = newQty;
            let totalQtyAfter = deliveryItems.reduce((sum, i) => sum + i.qty, 0);

            if (totalQtyBefore === 0 && totalQtyAfter === 1 && window.innerWidth <= 768) {
                const widget = document.getElementById('esCartWidget');
                const arrow = document.getElementById('mobile-cart-arrow');
                widget.classList.add('is-open');
                arrow.style.transform = 'rotate(180deg)';
            }

            renderItems();
            updateSummary();
        }

        function updateSummary() {
            let finalSum = 0;
            let itemsCount = 0;
            const list = document.getElementById('esCartItems');
            list.innerHTML = "";

            deliveryItems.forEach((item, idx) => {
                if (item.qty > 0) {
                    let itemTotal = item.price * item.qty;
                    finalSum += itemTotal;
                    itemsCount += item.qty;
                    
                    let row = document.createElement('div');
                    row.className = 'bg-white p-3 rounded-[1rem] border border-slate-100 shadow-[0_2px_10px_-2px_rgba(0,0,0,0.03)] mb-2 relative group';
                    row.innerHTML = `
                        <div class="flex justify-between items-center">
                            <div class="font-bold text-slate-800 text-sm leading-tight pr-4">
                                ${item.name} 
                                <span class="text-blue-500 ml-1 text-xs px-1.5 py-0.5 bg-blue-50 rounded-md">x${item.qty}</span>
                            </div>
                            <button class="text-slate-300 hover:text-rose-500 transition-colors p-1" onclick="changeQty(${idx}, -${item.qty})">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                            </button>
                        </div>
                        <div class="text-xs font-semibold text-slate-500 mt-1">${fmt(itemTotal)}</div>
                    `;
                    list.appendChild(row);
                }
            });

            if(itemsCount === 0) {
                list.innerHTML = "<div class='text-center py-8 text-slate-400 font-medium text-sm'>Добавьте позиции</div>";
            }

            document.getElementById('calcTotalSum').innerText = fmt(finalSum);

            const badge = document.getElementById('cart-count-badge');
            if(itemsCount > 0) {
                badge.innerText = itemsCount; badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        // --- ЛОГИКА ДОБАВЛЕНИЯ / РЕДАКТИРОВАНИЯ ---
        function openItemModal(idx) {
            editingIdx = idx;
            const modal = document.getElementById('itemModal');
            const title = document.getElementById('modalTitle');
            
            if (idx >= 0) {
                // Режим редактирования
                title.innerText = 'Редактировать позицию';
                document.getElementById('modalItemName').value = deliveryItems[idx].name;
                document.getElementById('modalItemPrice').value = deliveryItems[idx].price;
                document.getElementById('modalItemWeight').value = deliveryItems[idx].weight || '';
            } else {
                // Режим добавления
                title.innerText = 'Новая позиция';
                document.getElementById('modalItemName').value = '';
                document.getElementById('modalItemPrice').value = '';
                document.getElementById('modalItemWeight').value = '';
            }
            
            modal.classList.remove('hidden');
            document.body.classList.add('modal-open');
        }

        function closeItemModal() {
            document.getElementById('itemModal').classList.add('hidden');
            document.body.classList.remove('modal-open');
        }

        function saveItem() {
            const name = document.getElementById('modalItemName').value.trim();
            const price = parseFloat(document.getElementById('modalItemPrice').value) || 0;
            const weightVal = document.getElementById('modalItemWeight').value;
            const weight = weightVal === '' ? 0 : parseFloat(weightVal);
            
            if(!name) { 
                alert('Пожалуйста, введите название позиции'); 
                return; 
            }

            if (editingIdx >= 0) {
                // Обновляем существующую
                deliveryItems[editingIdx].name = name;
                deliveryItems[editingIdx].price = price;
                deliveryItems[editingIdx].weight = weight;
            } else {
                // Создаем новую
                deliveryItems.push({
                    name: name,
                    price: price,
                    weight: weight,
                    qty: 1
                });
                
                // Раскрываем корзину на мобилках при первом добавлении
                if (window.innerWidth <= 768) {
                    const widget = document.getElementById('esCartWidget');
                    if (!widget.classList.contains('is-open')) toggleMobileCart();
                }
            }
            
            closeItemModal();
            renderItems();
            updateSummary();
        }

        window.clearCalculator = function(e) { 
            if(e) e.stopPropagation(); 
            deliveryItems.forEach(item => item.qty = 0);
            renderItems(); 
            updateSummary();
            
            if(window.innerWidth <= 768) {
                document.getElementById('esCartWidget').classList.remove('is-open');
                document.getElementById('mobile-cart-arrow').style.transform = 'rotate(0deg)';
            }
        }

        window.toggleMobileCart = function() {
            if(window.innerWidth <= 768) {
                const widget = document.getElementById('esCartWidget');
                const arrow = document.getElementById('mobile-cart-arrow');
                widget.classList.toggle('is-open');
                arrow.style.transform = widget.classList.contains('is-open') ? 'rotate(180deg)' : 'rotate(0deg)';
            }
        }

        // ============================================
        // ЛОГИКА СКРЫТИЯ/ПОКАЗА НАВИГАЦИИ ПРИ СКРОЛЛЕ
        // ============================================
        let lastScrollTop = 0;
        const portalNav = document.getElementById('portal-nav');

        if (portalNav) {
            const initScrollLayout = () => {
                const navH = portalNav.offsetHeight;
                document.body.style.setProperty('--nav-h', navH + 'px');
                
                document.querySelectorAll('.scroll-area').forEach(area => {
                    let spacer = area.querySelector('.safe-spacer');
                    if (!spacer) {
                        spacer = document.createElement('div');
                        spacer.className = 'safe-spacer shrink-0 w-full';
                        area.insertBefore(spacer, area.firstChild);
                    }
                    spacer.style.height = navH + 'px';
                });
            };

            setTimeout(initScrollLayout, 50);
            window.addEventListener('resize', initScrollLayout);

            document.querySelectorAll('.scroll-area').forEach(scrollArea => {
                scrollArea.addEventListener('scroll', function() {
                    let currentScroll = this.scrollTop;
                    let maxScroll = this.scrollHeight - this.clientHeight;
                    
                    if (currentScroll <= 0 || currentScroll >= maxScroll - 5) return;
                    if (Math.abs(currentScroll - lastScrollTop) <= 5) return;

                    if (currentScroll > lastScrollTop && currentScroll > 50) {
                        portalNav.style.transform = 'translateY(-100%)'; 
                        document.body.classList.add('nav-hidden');
                    } else {
                        portalNav.style.transform = 'translateY(0)'; 
                        document.body.classList.remove('nav-hidden');
                    }
                    
                    lastScrollTop = currentScroll;
                }, { passive: true });
            });
        }

        renderItems();
        updateSummary();

    </script>
</body>
</html>
